# =============================================================================
# X-Plane FSUIPC Interface – Dataref Mappings
# =============================================================================
# Use Plugins ▸ FSUIPC ▸ Reload Mappings to apply changes at runtime.
#
# Three mapping forms are supported:
#
#   Static value
#     [[mapping]]
#     offset      = 0x3304
#     fsuipc_type = "u32"
#     static_value = 0x50000008
#
#   Simple (single dataref + linear transform):
#     [[mapping]]
#     offset      = 0x02BC
#     fsuipc_type = "i32"
#     dataref     = "sim/flightmodel/position/indicated_airspeed"
#     scale       = 128.0          # fsuipc = dataref * scale + offset_add
#     offset_add  = 0.0
#     writable    = false
#
#   Expression (multiple datarefs combined with RPN):
#     [[mapping]]
#     offset      = 0x0D0C
#     fsuipc_type = "u16"
#     datarefs    = { Nav  = "sim/cockpit2/switches/navigation_lights_on", Bcn  = "sim/cockpit2/switches/beacon_on", Land = "sim/cockpit2/switches/landing_lights_on", Taxi = "sim/cockpit2/switches/taxi_light_on", B738TaxiSwitch="laminar/B738/toggle_switch/taxi_light_brightness_pos", Strb = "sim/cockpit2/switches/strobe_lights_on" }
#     expr        = "$Nav 1 * $Bcn 2 * + $Land 4 * + $B738TaxiSwitch 1 $Taxi ? 8 * + $Strb 16 * +"
#
# TODO: update operator list below
# RPN operators: + - * / \ % ^ abs round & | == != < > <= >= ?
# Variable references: $name  (reads the named dataref)
#
# All offsets per XPUIPC Offsets PDF and XPUIPCOffsets.cfg reference.
# Scaling formulas verified against both documents.
# =============================================================================


# customise below and reload mappings for your flight

[[mapping]]
offset = 0x3500  # Aircraft ATC model name
fsuipc_type = "string"
static_value_str = "Boeing 737-800"
size = 24

[[mapping]]
offset = 0x3d00  # Aircraft title
fsuipc_type = "string"
static_value_str = "ZiboMod Boeing 737-800"
size = 256

[[mapping]]
offset = 0x313c  # ATC ID / tail number
fsuipc_type = "string"
static_value_str = "VH-VYD"
size = 12

[[mapping]]
offset = 0x2480  # Livery name - mentioned in downloaded FSUIPC changelong
fsuipc_type = "string"
static_value_str = "Qantas Airways (VH-VYD)"
size = 128

[[mapping]]
offset = 0x3160  # ATC type
fsuipc_type = "string"
static_value_str = "B738"
size = 24

[[mapping]]
offset = 0x3148  # ATC Airline
fsuipc_type = "string"
static_value_str = "QFA"
size = 24

# required for handshake - versions etc
# =============================================================================
# FSUIPC HEADER OFFSETS
# These identify this as XPUIPC to client software
# 0x3304 = FSUIPC version (0x50000008 = XPUIPC version 7.x)
# 0x3308 = FS version (0x0B00 = FSX-compatible, 0xFADEFFFF = X-Plane)
# =============================================================================

[[mapping]]
offset      = 0x3304
fsuipc_type = "u32"
static_value = 0x50000008

[[mapping]]
offset      = 0x3308
fsuipc_type = "u32"
static_value = 0xFADEFFFF

[[mapping]]
offset      = 0x3124
fsuipc_type = "u32"
static_value = 0x00000000

[[mapping]]
offset      = 0x320c
fsuipc_type = "u32"
static_value = 0x00000000

[[mapping]]
offset      = 0x3364  # ready to fly indicator = loaded
fsuipc_type = "u8"
static_value = 0

[[mapping]]
offset = 0x3365  # in-menu
fsuipc_type = "u8"
static_value = 0

[[mapping]]
offset = 0x0b52  # APU gen active
fsuipc_type = "u8"
dataref = "sim/cockpit2/electrical/APU_generator_on"

[[mapping]]
offset = 0x0b5c  # APU volts
fsuipc_type = "f32"
dataref = "sim/cockpit2/electrical/APU_generator_volts"

[[mapping]]
offset = 0x0b54  # APU RPM pc / N1
fsuipc_type = "f32"
dataref = "sim/cockpit2/electrical/APU_N1_percent"

[[mapping]]
offset = 0x0354  # transponder code
fsuipc_type = "u16"
dataref = "sim/cockpit2/radios/actuators/transponder_code"

[[mapping]]
offset      = 0x0C1A  # sim rate
fsuipc_type = "u16"
dataref     = "sim/time/sim_speed"
scale       = 256.0
writable    = true

[[mapping]]
offset      = 0x0E8C  # ambient air temp at altitude
fsuipc_type = "i16"
dataref     = "sim/weather/aircraft/temperature_ambient_deg_c"
scale       = 256.0

[[mapping]]
offset      = 0x0264  # pause indicator
fsuipc_type = "u16"
dataref     = "sim/time/paused"

[[mapping]]
offset      = 0x02BC  # IAS
fsuipc_type = "i32"
dataref     = "sim/flightmodel/position/indicated_airspeed"
scale       = 128.0                    # knots → knots*128

[[mapping]]
offset = 0x6010  # gps position lat in degrees
fsuipc_type = "f64"
dataref = "sim/flightmodel/position/latitude"

[[mapping]]
offset = 0x6018  # gps position lng in degrees
fsuipc_type = "f64"
dataref = "sim/flightmodel/position/longitude"

[[mapping]]
offset      = 0x3324  # indicated altitude
fsuipc_type = "i32"
datarefs     = { "pilot"="sim/cockpit2/gauges/indicators/altitude_ft_pilot", "copilot"="sim/cockpit2/gauges/indicators/altitude_ft_copilot", "standby"="sim/cockpit2/gauges/indicators/altitude_ft_stby"}
expr = "$pilot $copilot | $standby |"

[[mapping]]
offset      = 0x0580  # TRUE heading at a whacky scale
fsuipc_type = "u32"
dataref     = "sim/flightmodel/position/true_psi"
scale       = 11930464.711             # degrees → *65536*65536/360

[[mapping]]
offset      = 0x0BD0  # Spolier handle position, 4800 = armed
fsuipc_type = "u32"
datarefs    = { SB = "sim/cockpit2/controls/speedbrake_ratio" }
expr        = "$SB 0 > $SB 10763 * 5620 + $SB 0 < $SB -9600 * 0 ? ?"     # 0..1 → 4800..16383


[[mapping]]
offset      = 0x2E80  # Avionics master switch
fsuipc_type = "u32"
dataref     = "sim/cockpit2/switches/avionics_power_on"
writable    = true

[[mapping]]
offset      = 0x281C  # Battery master on, problematic, because generic always seems to be on
fsuipc_type = "u32"
datarefs = { "Zibo738" = "sim/cockpit2/electrical/battery_on[1]", "Generic" = "sim/cockpit/electrical/battery_on" }
expr = "$Zibo738 $Generic |"

[[mapping]]
offset      = 0x3102  # ELECTRICAL MASTER BATTERY, problematic, because generic always seems to be on, should be writable
fsuipc_type = "u16"
datarefs = { "Zibo738" = "sim/cockpit2/electrical/battery_on[1]", "Generic" = "sim/cockpit/electrical/battery_on" }
expr = "$Zibo738 $Generic |"

[[mapping]]
offset      = 0x0366  # SIM ON GROUND
fsuipc_type = "u16"
dataref     = "sim/flightmodel/failures/onground_any"

[[mapping]]
offset      = 0x02C8  # Vertical Speed
fsuipc_type = "i32"
dataref     = "sim/flightmodel/position/vh_ind"
scale       = 256.0                    # m/s → 256*m/s


[[mapping]]
offset = 0x030c  # TODO: this is not meant to be updated while 0x0366 On Ground is set
fsuipc_type = "i32"
dataref     = "sim/flightmodel/position/vh_ind"
scale       = 256.0                    # m/s → 256*m/s


[[mapping]]
offset      = 0x11BA  # G-Force, unknown units, TODO: check sign against original
fsuipc_type = "u16"
dataref     = "sim/flightmodel/forces/g_nrml"
scale       = 625.0

# =============================================================================
# LIGHTS  (combined bitmask)
# 0x0D0C  bit 0=Nav, 1=Beacon, 2=Landing, 3=Taxi, 4=Strobes  (u16)  rw
# =============================================================================

[[mapping]]
offset      = 0x0D0C
fsuipc_type = "u16"
datarefs    = { Nav  = "sim/cockpit2/switches/navigation_lights_on", Bcn  = "sim/cockpit2/switches/beacon_on", Land = "sim/cockpit2/switches/landing_lights_on", Taxi = "sim/cockpit2/switches/taxi_light_on", B738TaxiSwitch="laminar/B738/toggle_switch/taxi_light_brightness_pos", Strb = "sim/cockpit2/switches/strobe_lights_on" }
expr        = "$Nav 1 * $Bcn 2 * + $Land 4 * + $B738TaxiSwitch 1 $Taxi ? 8 * + $Strb 16 * +"

[[mapping]]
offset      = 0x02B4   # Ground velocity
fsuipc_type = "i32"
dataref     = "sim/flightmodel/position/groundspeed"
scale       = 65536.0                  # m/s → 65536*m/s

[[mapping]]
offset      = 0x2F70  # Pitch degrees
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/true_theta"

[[mapping]]
offset      = 0x2F78  # Bank degrees
fsuipc_type = "f64"
dataref     = "sim/flightmodel2/position/true_phi"

[[mapping]]
offset      = 0x30A8  # pitch X rate rad/s
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Qrad"

[[mapping]]
offset      = 0x30B0  # roll Z rate rad/s
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Prad"

[[mapping]]
offset      = 0x30B8  # yaw Y  rate rad/s
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Rrad"

[[mapping]]
offset      = 0x3060  # ACCELERATION BODY X (lateral/side to side)
fsuipc_type = "f64"
dataref     = "sim/flightmodel/forces/g_side"
scale       = 32.174                   # G → ft/s²

[[mapping]]
offset      = 0x3068  # ACCELERATION BODY Y (vertical up/down)
fsuipc_type = "f64"
dataref     = "sim/flightmodel/forces/g_nrml"
scale       = 32.174

[[mapping]]
offset      = 0x3070  # ACCELERATION BODY Z (longitudinal, forward/backward)
fsuipc_type = "f64"
dataref     = "sim/flightmodel/forces/g_axil"
scale       = 32.174

[[mapping]]  # TODO: check sign against OG
offset      = 0x3098  # X (lateral, or left/right) GS-velocity in ft/sec 
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/local_vx"
scale       = 3.28084

[[mapping]]  # TODO: check sign against OG
offset      = 0x30A0  # Y (vertical, or up/down) GS-velocity in ft/sec
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/local_vy"
scale       = 3.28084

[[mapping]]  # TODO: check sign against OG
offset      = 0x3090  # Z (longitudinal, or forward/backward) GS-velocity in ft/sec
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/local_vz"
scale       = 3.28084                  # m/s → ft/s

[[mapping]]
offset      = 0x0330  # Altimeter pressure setting (“Kollsman” window). As millibars (hectoPascals) * 16
fsuipc_type = "u16"
dataref     = "sim/cockpit2/gauges/actuators/barometer_setting_in_hg_pilot"
scale       = 541.82                   # inHg → mb*16  (1 inHg=33.8639 mb, *16)
writable    = true

[[mapping]]  # TODO: double check somehow if this is working
offset = 0x126C  # Fuel Quantity Total Weight in Pounds
fsuipc_type = "u32"
datarefs = { Tank0 = "sim/cockpit2/fuel/fuel_quantity[0]", Tank1 = "sim/cockpit2/fuel/fuel_quantity[1]", Tank2 = "sim/cockpit2/fuel/fuel_quantity[2]", Tank3 = "sim/cockpit2/fuel/fuel_quantity[3]", Tank4 = "sim/cockpit2/fuel/fuel_quantity[4]", Tank5 = "sim/cockpit2/fuel/fuel_quantity[5]", Tank6 = "sim/cockpit2/fuel/fuel_quantity[6]", Tank7 = "sim/cockpit2/fuel/fuel_quantity[7]", Tank8 = "sim/cockpit2/fuel/fuel_quantity[8]", Tank9 = "sim/cockpit2/fuel/fuel_quantity[9]" }
expr = "$Tank0 $Tank1 + $Tank2 + $Tank3 + $Tank4 + $Tank5 + $Tank6 + $Tank7 + $Tank8 + $Tank9 + 2.20462 *"

[[mapping]]
offset      = 0x0BC8  # parking brake
fsuipc_type = "u16"
dataref    = "sim/cockpit2/controls/wheel_brake_ratio_applied"
scale        = 32767
writable    = true

[[mapping]]
offset      = 0x0BB2  # Elevator position control input
fsuipc_type = "i16"
dataref     = "sim/cockpit2/controls/total_pitch_ratio"
scale       = 16383.0
writable    = true

[[mapping]]
offset      = 0x0BB6  # Aileron control input
fsuipc_type = "i16"
dataref     = "sim/cockpit2/controls/total_roll_ratio"
scale       = 16383.0

[[mapping]]
offset      = 0x0BBA  # Rudder control input
fsuipc_type = "i16"
dataref     = "sim/cockpit2/controls/total_heading_ratio"
scale       = 16383.0
writable    = true

# 0x3328, 0x332A, 0x332C not actually called for by SLC but differentiate from 0x0BB2, 0x0BB6, 0x0BBA
[[mapping]]
offset      = 0x3328  # Elevator position control input
fsuipc_type = "i16"
dataref     = "sim/cockpit2/controls/yoke_pitch_ratio"
scale       = 16383.0
writable    = true

[[mapping]]
offset      = 0x332A  # Aileron control input
fsuipc_type = "i16"
dataref     = "sim/cockpit2/controls/yoke_roll_ratio"
scale       = 16383.0

[[mapping]]
offset      = 0x332C  # Rudder control input
fsuipc_type = "i16"
dataref     = "sim/cockpit2/controls/yoke_heading_ratio"
scale       = 16383.0
writable    = true

[[mapping]]
offset      = 0x0AEC  # num engines
# SLC requests it as a u32 but docs indicate it's an u16
fsuipc_type = "u16"
dataref     = "sim/aircraft/engine/acf_num_engines"


# =============================================================================
# ENGINE – N1  (turbine, % 0-100 → 0-16384)
# =============================================================================

[[mapping]]
offset      = 0x0898
# SLC requests it as a u32 but docs indicate it's an u16
fsuipc_type = "i16"
dataref     = "sim/flightmodel/engine/ENGN_N1_[0]"
scale       = 163.84                   # % → 0-16384

[[mapping]]
offset      = 0x0930
# SLC requests it as a u32 but docs indicate it's an u16
fsuipc_type = "i16"
dataref     = "sim/flightmodel/engine/ENGN_N1_[1]"
scale       = 163.84

[[mapping]]
offset      = 0x09C8
# SLC requests it as a u32 but docs indicate it's an u16
fsuipc_type = "i16"
dataref     = "sim/flightmodel/engine/ENGN_N1_[2]"
scale       = 163.84

[[mapping]]
offset      = 0x0A60
# SLC requests it as a u32 but docs indicate it's an u16
fsuipc_type = "i16"
dataref     = "sim/flightmodel/engine/ENGN_N1_[3]"
scale       = 163.84

# ======================================================================
# DOORS
#
# There doesn't appear to be any formal documentation about what 
# bit correspondes with what door, so this may be inaccurage
#
# ===================================================================
[[mapping]]
offset      = 0x3367
fsuipc_type = "u8"
datarefs    = { 738_L1  = "737u/doors/L1", 738_L2  = "737u/doors/L2", 738_R1  = "737u/doors/R1", 738_R2  = "737u/doors/R2", 738_FwdCgo = "737u/doors/Fwd_Cargo", 738_AftCgo = "737u/doors/aft_Cargo" }
expr        = "$738_L1 $738_L2 | 1 * $738_R2 $738_R1 | 8 * + $738_FwdCgo $738_AftCgo | 32 * +"

[[mapping]]
offset = 0x341d
fsuipc_type = "u8"
dataref = "sim/cockpit2/switches/fasten_seat_belts"


[[mapping]]
offset      = 0x0840
fsuipc_type = "u16"
dataref     = "sim/flightmodel2/misc/has_crashed"

[[mapping]]
offset      = 0x028C
fsuipc_type = "u8"
dataref     = "sim/cockpit2/switches/landing_lights_on"
writable    = true

[[mapping]]
offset      = 0x0BDC
fsuipc_type = "u32"
dataref     = "sim/cockpit2/controls/flap_handle_request_ratio"
scale       = 16383.0
writable    = true

[[mapping]]
offset      = 0x0BE8
fsuipc_type = "u32"
dataref     = "sim/cockpit/switches/gear_handle_status"
scale       = 16383.0
writable    = true

[[mapping]]
offset      = 0x0238
fsuipc_type = "u8"
dataref     = "sim/cockpit2/clock_timer/local_time_hours"

[[mapping]]
offset      = 0x0239
fsuipc_type = "u8"
dataref     = "sim/cockpit2/clock_timer/local_time_minutes"

[[mapping]]
offset      = 0x023A
fsuipc_type = "u8"
dataref     = "sim/cockpit2/clock_timer/local_time_seconds"

[[mapping]]
offset      = 0x023B
fsuipc_type = "u8"
dataref     = "sim/cockpit2/clock_timer/zulu_time_hours"
writable    = true

[[mapping]]
offset      = 0x023C
fsuipc_type = "u8"
dataref     = "sim/cockpit2/clock_timer/zulu_time_minutes"
writable    = true

# 0x0246 local offset from Zulu minutes, +ve=behind. Handles midnight crossover.
[[mapping]]
offset      = 0x0246
fsuipc_type = "i16"
dataref    = "xplane-uipc-helper/time/offset_minutes_negated"

[[mapping]]
offset = 0x115e  # Time of day indicator, 0=Dawn, 1=Day, 2=Dusk, 3=Night. Set according to the local time, read for lighting effects and so on in BGLs
fsuipc_type = "u8"
datarefs = { sp = "sim/graphics/scenery/sun_pitch_degrees", lh = "sim/cockpit2/clock_timer/local_time_hours" }
expr = "$sp 0 <= $sp -6 >= & dup $lh 12 < & 0 swap $lh 12 >= & 2 $sp 0 > 1 3 ? ? ?"

# =============================================================================
# POSITION
# 0x0560  Latitude  (i64) – FS units: multiply by 90/(10001750*65536*65536)
#         Inverse: degrees * 10001750*65536*65536/90
# 0x0568  Longitude (i64) – FS units: multiply by 360/(65536^4)
#         Inverse: degrees * 65536^4/360
# =============================================================================

[[mapping]]
offset      = 0x0560
fsuipc_type = "i64"
dataref     = "sim/flightmodel/position/latitude"
scale       = 7277882953.7777          # degrees → FS lat units (10001750*65536*65536/90)

[[mapping]]
offset      = 0x0568
fsuipc_type = "i64"
dataref     = "sim/flightmodel/position/longitude"
scale       = 12947848928.8888         # degrees → FS lon units (65536^4/360)

# =============================================================================
# ALTITUDE
# 0x0570  altitude in metres as FLOAT64 split:
#           high 32-bit integer (0x0574) = whole metres
#           low  32-bit integer (0x0570) = fractional metres * 2^32
#         We write the whole metres to 0x0574 and zero to 0x0570 (sufficient
#         for most clients which only read 0x0574).
# =============================================================================

[[mapping]]
offset      = 0x0574 # elevation in metres, whole-part only, if specifcally called
fsuipc_type = "i32"
dataref     = "sim/flightmodel/position/elevation"

[[mapping]]
offset      = 0x0570  # This sets the full Q-word - as it is retrieved by SLC - 8 bytes
fsuipc_type = "i64"
datarefs    = { elev = "sim/flightmodel/position/elevation" }
expr        = "$elev 1 % 4294967296 *"  # fractional metres * 2^32

# =============================================================================
# ATTITUDE
# 0x0578  Pitch:   *360/(65536*65536) for degrees. 0=level, -ve=nose up
#         Inverse: degrees * 65536*65536/360  NOTE: X-Plane: +ve=nose up → negate
# 0x057C  Bank:    *360/(65536*65536), -ve=right wing down
#         X-Plane phi: +ve=right wing down → negate
# =============================================================================

[[mapping]]
offset      = 0x0578
fsuipc_type = "i32"
datarefs    = { pitch = "sim/flightmodel/position/theta" }
expr        = "$pitch -1 * 65536 * 65536 * 360 /"   # negate + scale

[[mapping]]
offset      = 0x057C
fsuipc_type = "i32"
datarefs    = { bank = "sim/flightmodel/position/phi" }
expr        = "$bank -1 * 65536 * 65536 * 360 /"    # negate + scale


# 0x31F0, 4  - pushback status 3=off, 0=pushing back, 1=pushing back, tail to swing to left
#             (port), 2=pushing back, tail to swing to right (starboard)
[[mapping]]
offset = 0x31F0
fsuipc_type = "u32"
datarefs = { BP_Started ="bp/started", PB_Attached = "sim/aircraft/overflow/pushback_attached" }
expr = "$BP_Started $PB_Attached | 0 3 ?"

[[mapping]]
offset = 0x7b91  # SquawkBox Transponder mode, 0 = normal, 1 = standby: https://squawkbox.ca/doc/sdk/fsuipc.php
fsuipc_type = "u8"
datarefs = { T_Mode = "sim/cockpit2/radios/actuators/transponder_mode" }
expr = "$T_Mode 2 <"

[[mapping]]
offset = 0x023e  # Zulu day of year (TODO: 0 or 1 indexed?)
fsuipc_type = "u16"
dataref = "sim/time/zulu_date_days"  # 0 indexed

# provided by custom LUA script
[[mapping]]
offset = 0x0245  # local day of month
fsuipc_type = "u8"
dataref = "xplane-uipc-helper/time/local_day_of_month"

[[mapping]]
offset = 0x0244  # local month of year
fsuipc_type = "u8"
dataref = "xplane-uipc-helper/time/local_month"

[[mapping]]
offset = 0x024a  # local month of year
fsuipc_type = "u16"
dataref = "xplane-uipc-helper/time/local_year"

[[mapping]]
offset = 0x0240  # local month of year
fsuipc_type = "u16"
dataref = "xplane-uipc-helper/time/zulu_year"

[[mapping]]
offset = 0x023d  # zulu day of month
fsuipc_type = "u8"
dataref = "xplane-uipc-helper/time/zulu_day_of_month"

[[mapping]]
offset = 0x0242  # zulu day of month
fsuipc_type = "u8"
dataref = "xplane-uipc-helper/time/zulu_month"