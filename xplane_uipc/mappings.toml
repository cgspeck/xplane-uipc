# Time writes also turn off "use system time" (UseSys = 0); while it is on,
# X-Plane resets the clock to the system time and the write reverts.
[[mapping]]
offset      = 0x0238  # Local hour; local_time_sec is read-only, so a write shifts Zulu time
fsuipc_type = "u8"
datarefs    = {
    LH     = "sim/cockpit2/clock_timer/local_time_hours",
    Z      = "sim/time/zulu_time_sec",
    UseSys = "sim/time/use_system_time",
}
expr        = "$LH"
writable    = true
write_exprs = {
    Z      = "$Z $value $LH - 3600 * + 86400 + 86400 %",
    UseSys = "0",
}

[[mapping]]
offset      = 0x0239  # Local minute; a write shifts Zulu time
fsuipc_type = "u8"
datarefs    = {
    LM     = "sim/cockpit2/clock_timer/local_time_minutes",
    Z      = "sim/time/zulu_time_sec",
    UseSys = "sim/time/use_system_time",
}
expr        = "$LM"
writable    = true
write_exprs = {
    Z      = "$Z $value $LM - 60 * + 86400 + 86400 %",
    UseSys = "0",
}

[[mapping]]
offset      = 0x023A  # Second
fsuipc_type = "u8"
datarefs    = {
    S      = "sim/cockpit2/clock_timer/local_time_seconds",
    Z      = "sim/time/zulu_time_sec",
    UseSys = "sim/time/use_system_time",
}
expr        = "$S"
writable    = true
write_exprs = {
    Z      = "$Z $Z 60 % - $value +",
    UseSys = "0",
}

[[mapping]]
offset      = 0x023B  # Zulu hour
fsuipc_type = "u8"
datarefs    = {
    H      = "sim/cockpit2/clock_timer/zulu_time_hours",
    Z      = "sim/time/zulu_time_sec",
    UseSys = "sim/time/use_system_time",
}
expr        = "$H"
writable    = true
write_exprs = {
    Z      = "$value 3600 * $Z 3600 % +",
    UseSys = "0",
}

[[mapping]]
offset      = 0x023C  # Zulu minute
fsuipc_type = "u8"
datarefs    = {
    M      = "sim/cockpit2/clock_timer/zulu_time_minutes",
    Z      = "sim/time/zulu_time_sec",
    UseSys = "sim/time/use_system_time",
}
expr        = "$M"
writable    = true
write_exprs = {
    Z      = "$Z $Z 3600 % - $value 60 * + $Z 60 % +",
    UseSys = "0",
}

# 0x0246 local offset from Zulu minutes, +ve=behind. Handles midnight crossover.
[[mapping]]
offset      = 0x0246
fsuipc_type = "i16"
dataref    = "xplane-uipc-helper/time/offset_minutes_negated"

[[mapping]]
offset = 0x115e  # Time of day indicator, 0=Dawn, 1=Day, 2=Dusk, 3=Night. Set according to the local time, read for lighting effects and so on in BGLs
fsuipc_type = "u8"
datarefs = {
    sp = "sim/graphics/scenery/sun_pitch_degrees",
    lh = "sim/cockpit2/clock_timer/local_time_hours",
}
expr = "$sp 0 <= $sp -6 >= & dup $lh 12 < & 0 swap $lh 12 >= & 2 $sp 0 > 1 3 ? ? ?"

# =============================================================================
# POSITION
# 0x0560  Latitude  (i64) – FS units: multiply by 90/(10001750*65536*65536)
#         Inverse: degrees * 10001750*65536*65536/90
# 0x0568  Longitude (i64) – FS units: multiply by 360/(65536^4)
#         Inverse: degrees * 65536^4/360
# =============================================================================

[[mapping]]
offset      = 0x0560
fsuipc_type = "i64"
datarefs     = {
    Lat = "sim/flightmodel/position/latitude",
}
expr = "$Lat 90 10001750 65536 * 65536 * / /"

[[mapping]]
offset      = 0x0568
fsuipc_type = "i64"
datarefs     = {
    Lng = "sim/flightmodel/position/longitude",
}
expr = "$Lng 360 65536 65536 * 65536 * 65536 * / /"

# =============================================================================
# ALTITUDE
# 0x0570  altitude in metres as FLOAT64 split:
#           high 32-bit integer (0x0574) = whole metres
#           low  32-bit integer (0x0570) = fractional metres * 2^32
# =============================================================================

[[mapping]]
offset      = 0x0574 # elevation in metres, whole-part only, if specifcally called
fsuipc_type = "i32"
datarefs     = {
    elev = "sim/flightmodel/position/elevation",
}
expr = "$elev floor"

[[mapping]]
offset      = 0x0570
fsuipc_type = "i64"
datarefs    = {
    elev = "sim/flightmodel/position/elevation",
}
expr        = "$elev 3.28084 65536 65536 * / /"  # fractional metres * 2^32

# =============================================================================
# ATTITUDE
# 0x0578  Pitch:   *360/(65536*65536) for degrees. 0=level, -ve=nose up
#         Inverse: degrees * 65536*65536/360  NOTE: X-Plane: +ve=nose up → negate
# 0x057C  Bank:    *360/(65536*65536), -ve=right wing down
#         X-Plane phi: +ve=right wing down → negate
# =============================================================================

[[mapping]]
offset      = 0x0578
fsuipc_type = "i32"
datarefs    = {
    pitch = "sim/flightmodel/position/theta",
}
expr        = "$pitch -1 * 360 65536 65536 * / /"   # negate + scale

[[mapping]]
offset      = 0x057C
fsuipc_type = "i32"
datarefs    = {
    bank = "sim/flightmodel/position/phi",
}
expr        = "$bank -1 * 360 65536 65536 * / /"    # negate + scale


# 0x31F0, 4  - pushback status 3=off, 0=pushing back, 1=pushing back, tail to swing to left
#             (port), 2=pushing back, tail to swing to right (starboard)
[[mapping]]
offset = 0x31F0
fsuipc_type = "u32"
datarefs = {
    BP_Started  = "bp/started",
    PB_Attached = "sim/aircraft/overflow/pushback_attached",
}
expr = "$BP_Started $PB_Attached | 0 3 ?"

[[mapping]]
offset = 0x7b91  # SquawkBox Transponder mode, 0 = normal, 1 = standby: https://squawkbox.ca/doc/sdk/fsuipc.php
fsuipc_type = "u8"
datarefs = {
    T_Mode = "sim/cockpit2/radios/actuators/transponder_mode",
}
expr = "$T_Mode 2 <"

[[mapping]]
offset = 0x023e  # Zulu day of year (1 indexed)
fsuipc_type = "u16"
datarefs = {  # 0 indexed but msfs is 1 indexed
    DayZ = "sim/time/zulu_date_days",
}
expr = "$DayZ 1 +"

# provided by custom LUA script
[[mapping]]
offset = 0x0245  # local day of month
fsuipc_type = "u8"
dataref = "xplane-uipc-helper/time/local_day_of_month"

[[mapping]]
offset = 0x0244  # local month of year
fsuipc_type = "u8"
dataref = "xplane-uipc-helper/time/local_month"

[[mapping]]
offset = 0x024a  # local month of year
fsuipc_type = "u16"
dataref = "xplane-uipc-helper/time/local_year"

[[mapping]]
offset = 0x0240  # local month of year
fsuipc_type = "u16"
dataref = "xplane-uipc-helper/time/zulu_year"

[[mapping]]
offset = 0x023d  # zulu day of month
fsuipc_type = "u8"
dataref = "xplane-uipc-helper/time/zulu_day_of_month"

[[mapping]]
offset = 0x0242  # zulu day of month
fsuipc_type = "u8"
dataref = "xplane-uipc-helper/time/zulu_month"
