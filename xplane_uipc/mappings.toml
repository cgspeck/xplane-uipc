# =============================================================================
# X-Plane FSUIPC Interface – Dataref Mappings
# =============================================================================
# Use Plugins ▸ FSUIPC ▸ Reload Mappings to apply changes at runtime.
#
# Tables such as datarefs, write_exprs and write_commands can span several lines,
# one entry per line, with a trailing comma and comments allowed (TOML 1.1).
#
# Three mapping forms are supported:
#
#   Static value
#     [[mapping]]
#     offset      = 0x3304
#     fsuipc_type = "u32"
#     static_value = 0x50000008
#
#   Simple (single dataref + linear transform):
#     [[mapping]]
#     offset      = 0x02BC
#     fsuipc_type = "i32"
#     dataref     = "sim/flightmodel/position/indicated_airspeed"
#     scale       = 128.0          # fsuipc = dataref * scale + offset_add
#     offset_add  = 0.0
#     writable    = false
#
#   Expression (multiple datarefs combined with RPN):
#     [[mapping]]
#     offset      = 0x0D0C
#     fsuipc_type = "u16"
#     datarefs    = {
#         Nav            = "sim/cockpit2/switches/navigation_lights_on",
#         Bcn            = "sim/cockpit2/switches/beacon_on",
#         Land           = "sim/cockpit2/switches/landing_lights_on",
#         Taxi           = "sim/cockpit2/switches/taxi_light_on",
#         B738TaxiSwitch = "laminar/B738/toggle_switch/taxi_light_brightness_pos",
#         Strb           = "sim/cockpit2/switches/strobe_lights_on",
#     }
#     expr        = "$Nav 1 * $Bcn 2 * + $Land 4 * + $B738TaxiSwitch 1 $Taxi ? 8 * + $Strb 16 * +"
# 
#   Expressions can also take an optional conditional to determine when the value is updated, e.g.:
#
#     [[mapping]]
#     offset = 0x030c  # Aircraft vertical speed at touchdown, do not update when on ground, note that bounces will reset this
#     fsuipc_type = "i32"
#     datarefs     = {
#         VhInd    = "sim/flightmodel/position/vh_ind",
#         OnGround = "sim/flightmodel/failures/onground_any",
#     }
#     update_if_expr = "$OnGround 0 =="
#     expr = "$VhInd 256.0 *"                    # m/s → 256*m/s
#
# Writes
#
#   A client can only write an offset whose mapping has writable = true.
#
#   Simple mappings reverse the linear transform: dataref = (value - offset_add) / scale.
#   A writable simple mapping can't have scale = 0.
#
#   Expression mappings need write_exprs, write_commands or both.
#
#   write_exprs has one RPN expression per dataref to write,
#   keyed by a name from datarefs. $value is the number the client wrote (in FSUIPC
#   units) and every datarefs name holds that dataref's current value, e.g.:
#
#     [[mapping]]
#     offset      = 0x023B  # Zulu hour
#     fsuipc_type = "u8"
#     datarefs    = {
#         H = "sim/cockpit2/clock_timer/zulu_time_hours",
#         Z = "sim/time/zulu_time_sec",
#     }
#     expr        = "$H"
#     writable    = true
#     write_exprs = {  # new hour, same minutes and seconds
#         Z = "$value 3600 * $Z 3600 % +",
#     }
#
#   write_commands is for aircraft that override their datarefs and only respond to
#   X-Plane commands. Each key is a command path, and each expression (same variables)
#   gives how many times to run it: 0 = don't, 1 = once, up to 10. To toggle a switch
#   only when it's in the wrong state, compare the requested part of $value with the
#   switch's state dataref, e.g. for the landing-light bit:
#
#     write_commands = {
#         "<toggle command>" = "$value 4 & 0 != $ZLand 0 != !=",
#     }
#
#   Every expression is evaluated before anything is written. If any result is not a
#   finite number, nothing is written and no command runs. Otherwise the datarefs are
#   written first, then the commands run. A dataref or command that isn't available is
#   skipped and the others still go ahead; the first skip of each one after mappings
#   load logs an error. Expressions can only use $value and names from datarefs, and a
#   datarefs entry can't be called "value".
#
#   These are load errors (logged, and the mapping is skipped):
#     - writable = true on an expression mapping with neither write_exprs nor write_commands
#     - write_exprs or write_commands without expr, or without writable = true
#     - a write_commands key that isn't a command path (it has no "/")
#     - writable = true with scale = 0
#     - both dataref and expr on one mapping
#
#
# RPN operators: see README-EXPR.md
# Variable references: $name  (reads the named dataref)
#
# All offsets per XPUIPC Offsets PDF and XPUIPCOffsets.cfg reference.
# Scaling formulas verified against both documents.
# =============================================================================


# customise below and reload mappings for your flight

[[mapping]]
offset = 0x3500  # Aircraft ATC model name
fsuipc_type = "string"
static_value_str = "737"
size = 24

[[mapping]]
offset = 0x3d00  # Aircraft title
fsuipc_type = "string"
static_value_str = "ZiboMod Boeing 737-800"
size = 256

[[mapping]]
offset = 0x313c  # ATC ID / tail number
fsuipc_type = "string"
static_value_str = "VH-VYD"
size = 12

[[mapping]]
offset = 0x2480  # Livery name - mentioned in downloaded FSUIPC changelong
fsuipc_type = "string"
static_value_str = "Qantas Airways (VH-VYD)"
size = 128

[[mapping]]
offset = 0x3160  # ATC type
fsuipc_type = "string"
static_value_str = "Boeing"
size = 24

[[mapping]]
offset = 0x3148  # ATC Airline
fsuipc_type = "string"
static_value_str = "Qantas"
size = 24

# required for handshake - versions etc
# =============================================================================
# FSUIPC HEADER OFFSETS
# These identify this as XPUIPC to client software
# 0x3304 = FSUIPC "interim version" - u16
# 0x3308 = FSUIPC  BCD Maj-Minor version - u16
# 0x3304 is actually written back as a u32 with both registers combined
# 0x3308 = FS version (0x0B00 = FSX-compatible, 0xFADEFFFF = X-Plane)
# =============================================================================

[[mapping]]  # FSUIPC interim version Id, 0=none, 1-26 = a-z
offset      = 0x3304
# fsuipc_type = "u16"
# static_value = 0
fsuipc_type = "u32"
static_value = 0x50000008

[[mapping]]  # FSUIPC version, BCD. e.g. 0x1998 = version 1.998
offset      = 0x3306
fsuipc_type = "u16"
static_value = 0x7507

[[mapping]]  # FS version, 1=FS98, 2=FS2K, 3=CFS2, 4=CFS1, 5=reserved, 6=FS2002, 7=FS2004, 8=FSX, 9=ESP, 10=P3D
offset      = 0x3308
# this is actually read with 330A, which must be 'FADE', essentually a fixed check-value
# fsuipc_type = "u16"
# static_value = 13
fsuipc_type = "u32"
static_value = 0xFADEFFFF

[[mapping]]  #  Hot keys: # of slots
offset      = 0x320c
fsuipc_type = "u32"
static_value = 56

[[mapping]]  # Hot buttons: # of slots
offset = 0x290C
fsuipc_type = "u32"
static_value = 56

[[mapping]]
offset      = 0x3364  # ready to fly indicator = loaded
fsuipc_type = "u8"
static_value = 0

[[mapping]]
offset = 0x3365  # in-menu
fsuipc_type = "u8"
static_value = 0

[[mapping]]
offset = 0x0b52  # APU gen active
fsuipc_type = "u8"
dataref = "sim/cockpit2/electrical/APU_generator_on"

[[mapping]]
offset = 0x0b5c  # APU volts
fsuipc_type = "f32"
dataref = "sim/cockpit2/electrical/APU_generator_volts"

[[mapping]]
offset = 0x0b54  # APU RPM pc / N1
fsuipc_type = "f32"
dataref = "sim/cockpit2/electrical/APU_N1_percent"

[[mapping]]
offset = 0x0354  # transponder code
fsuipc_type = "u16"
dataref = "sim/cockpit2/radios/actuators/transponder_code"

[[mapping]]
offset      = 0x0C1A  # sim rate
fsuipc_type = "u16"
dataref     = "sim/time/sim_speed"
scale       = 256.0
writable    = true

[[mapping]]
offset      = 0x0E8C  # ambient air temp at altitude
fsuipc_type = "i16"
dataref     = "sim/weather/aircraft/temperature_ambient_deg_c"
scale       = 256.0

[[mapping]]
offset      = 0x0264  # pause indicator
fsuipc_type = "u16"
dataref     = "sim/time/paused"

[[mapping]]
offset      = 0x02BC  # IAS
fsuipc_type = "i32"
dataref     = "sim/flightmodel/position/indicated_airspeed"
scale       = 128.0                    # knots → knots*128

[[mapping]]
offset = 0x6010  # gps position lat in degrees
fsuipc_type = "f64"
dataref = "sim/flightmodel/position/latitude"

[[mapping]]
offset = 0x6018  # gps position lng in degrees
fsuipc_type = "f64"
dataref = "sim/flightmodel/position/longitude"

[[mapping]]
offset      = 0x3324  # indicated altitude
fsuipc_type = "i32"
datarefs     = {
    "pilot"   = "sim/cockpit2/gauges/indicators/altitude_ft_pilot",
    "copilot" = "sim/cockpit2/gauges/indicators/altitude_ft_copilot",
    "standby" = "sim/cockpit2/gauges/indicators/altitude_ft_stby",
}
expr = "$pilot $copilot | $standby |"

[[mapping]]
offset      = 0x0580  # TRUE heading at a whacky scale
fsuipc_type = "u32"
datarefs    = {
    Hdg = "sim/flightmodel/position/true_psi",
}
expr = "$Hdg 65536 65536 * * 360 \\"

[[mapping]]
offset      = 0x0BD0  # Spolier handle position, 4800 = armed
fsuipc_type = "u32"
datarefs    = {
    SB = "sim/cockpit2/controls/speedbrake_ratio",
}
expr        = "$SB 0 > $SB 10763 * 5620 + $SB 0 < $SB -9600 * 0 ? ?"     # 0..1 → 4800..16383
writable    = true
write_exprs = {  # 4800 → armed (-0.5), 5620..16383 → 0..1
    SB = "$value 4800 == -0.5 $value 5620 - 10763 / 0 max ?",
}


[[mapping]]
offset      = 0x2E80  # Avionics master switch; an expression mapping so it can also run add-on commands
fsuipc_type = "u32"
datarefs    = {
    Av     = "sim/cockpit2/switches/avionics_power_on",
    CitXAv = "laminar/CitX/electrical/avionics",
}
expr        = "$Av"
writable    = true
write_commands = {
    "sim/systems/avionics_toggle"                 = "$value $Av !=",
    "laminar/CitX/electrical/cmd_avionics_toggle" = "$value $CitXAv !=",
}

[[mapping]]
offset      = 0x281C  # Battery master on, problematic, because generic always seems to be on
fsuipc_type = "u32"
datarefs = {
    "Zibo738" = "sim/cockpit2/electrical/battery_on[1]",
    "Generic" = "sim/cockpit/electrical/battery_on",
}
expr = "$Zibo738 $Generic |"
writable    = true
# The toggle runs once, only when the requested state differs from $ZBat.
write_commands = {
    "sim/electrical/battery_all_toggle"               = "$value $Generic !=",
    "laminar/CitX/electrical/cmd_battery_left_toggle" = "$value $Generic !=",
    "laminar/B738/switch/battery_dn"                  = "$value 1 ==",
    "laminar/B738/switch/battery_up"                  = "$value 0 ==",
}

[[mapping]]
offset      = 0x3102  # ELECTRICAL MASTER BATTERY, problematic, because generic always seems to be on, should be writable
fsuipc_type = "u8"
datarefs = {
    "Zibo738" = "sim/cockpit2/electrical/battery_on[1]",
    "Generic" = "sim/cockpit/electrical/battery_on",
}
expr = "$Zibo738 $Generic |"
writable    = true
# The toggle runs once, only when the requested state differs from $ZBat.
write_commands = {
    "sim/electrical/battery_all_toggle"               = "$value $Generic !=",
    "laminar/CitX/electrical/cmd_battery_left_toggle" = "$value $Generic !=",
    "laminar/B738/switch/battery_dn"                  = "$value 1 ==",
    "laminar/B738/switch/battery_up"                  = "$value 0 ==",
}

[[mapping]]
offset      = 0x0366  # SIM ON GROUND
fsuipc_type = "u16"
dataref     = "sim/flightmodel/failures/onground_any"

[[mapping]]
offset      = 0x02C8  # Vertical Speed
fsuipc_type = "i32"
dataref     = "sim/flightmodel/position/vh_ind"
scale       = 256.0                    # m/s → 256*m/s


[[mapping]]
offset = 0x030c  # Aircraft vertical speed at touchdown, do not update when on ground, note that bounces will reset this
fsuipc_type = "i32"
datarefs     = {
    VhInd    = "sim/flightmodel/position/vh_ind",
    OnGround = "sim/flightmodel/failures/onground_any",
}
update_if_expr = "$OnGround 0 =="
expr = "$VhInd 256.0 *"                    # m/s → 256*m/s


[[mapping]]
offset      = 0x11BA  # G-Force, unknown units, TODO: check sign against original
fsuipc_type = "u16"
dataref     = "sim/flightmodel/forces/g_nrml"
scale       = 625.0

# =============================================================================
# LIGHTS  (combined bitmask)
# 0x0D0C  (u16)  rw
# =============================================================================
# 1=Nav, 2=Bcn, 4=Land, 8=Taxi, 16=Strobe, 32=Panel, 64=Recognition, 128=Wing, 256=Logo, 512=Cabin (see also $0280, $0281 and $028C)
[[mapping]]
offset      = 0x0D0C
fsuipc_type = "u16"
datarefs    = {
    Nav            = "sim/cockpit2/switches/navigation_lights_on",
    Bcn            = "sim/cockpit2/switches/beacon_on",
    Land           = "sim/cockpit2/switches/landing_lights_on",
    Taxi           = "sim/cockpit2/switches/taxi_light_on",
    B738TaxiSwitch = "laminar/B738/toggle_switch/taxi_light_brightness_pos",
    Strb           = "sim/cockpit2/switches/strobe_lights_on",
    Wing           = "laminar/B738/toggle_switch/wing_light",
    Logo           = "laminar/B738/toggle_switch/logo_light",
}
expr        = "$Nav 1 * $Bcn 2 * + $Land 4 * + $B738TaxiSwitch 1 $Taxi ? 8 * + $Strb 16 * + $Wing 128 * + $Logo 256 * +"
writable    = true
# NOTE: the write_commands are only partially implemented
write_exprs = {
    Nav  = "$value 1 & 0 !=",
    Bcn  = "$value 2 & 0 !=",
    Land = "$value 4 & 0 !=",
    Taxi = "$value 8 & 0 !=",
    Strb = "$value 16 & 0 !=",
}
write_commands = {
    "laminar/B738/switch/logo_light_toggle"                = "$value 256 & $Logo !=",
    "laminar/B738/switch/wing_light_toggle"                = "$value 128 & $Wing !=",
    "laminar/B738/toggle_switch/position_light_strobe"     = "$value 16 & 0 !=",
    "laminar/B738/toggle_switch/position_light_steady"     = "$value 16 & 0 == $value 1 & 0 != &",
    "laminar/B738/toggle_switch/position_light_off"        = "$value 17 & 0 ==",
    "laminar/B738/toggle_switch/taxi_light_brightness_on"  = "$value 8 & 0 !=",
    "laminar/B738/toggle_switch/taxi_light_brightness_off" = "$value 8 & 0 ==",
}


[[mapping]]
offset      = 0x02B4   # Ground velocity
fsuipc_type = "i32"
dataref     = "sim/flightmodel/position/groundspeed"
scale       = 65536.0                  # m/s → 65536*m/s

[[mapping]]
offset      = 0x2F70  # Pitch degrees
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/true_theta"

[[mapping]]
offset      = 0x2F78  # Bank degrees
fsuipc_type = "f64"
dataref     = "sim/flightmodel2/position/true_phi"

[[mapping]]
offset      = 0x30A8  # pitch X rate rad/s
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Qrad"

[[mapping]]
offset      = 0x30B0  # roll Z rate rad/s
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Prad"

[[mapping]]
offset      = 0x30B8  # yaw Y  rate rad/s
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Rrad"

[[mapping]]
offset      = 0x3060  # ACCELERATION BODY X (lateral/side to side)
fsuipc_type = "f64"
dataref     = "sim/flightmodel/forces/g_side"
scale       = 32.174                   # G → ft/s²

[[mapping]]
offset      = 0x3068  # ACCELERATION BODY Y (vertical up/down)
fsuipc_type = "f64"
datarefs = {
    Bank  = "sim/flightmodel2/position/true_phi",
    GNrml = "sim/flightmodel/forces/g_nrml",
    Pitch = "sim/flightmodel/position/true_theta",
}
expr = "$GNrml $Pitch PI * 180 / cos $Bank PI * 180 / cos * - 32.174 *"

[[mapping]]
offset      = 0x3070  # ACCELERATION BODY Z (longitudinal, forward/backward)
fsuipc_type = "f64"
dataref     = "sim/flightmodel/forces/g_axil"
scale       = 32.174

[[mapping]]  # TODO: check sign against OG
offset      = 0x3098  # X (lateral, or left/right) GS-velocity in ft/sec 
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/local_vx"
scale       = 3.28084

[[mapping]]  # TODO: check sign against OG
offset      = 0x30A0  # Y (vertical, or up/down) GS-velocity in ft/sec
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/local_vy"
scale       = 3.28084

[[mapping]]  # TODO: check sign against OG
offset      = 0x3090  # Z (longitudinal, or forward/backward) GS-velocity in ft/sec
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/local_vz"
scale       = 3.28084                  # m/s → ft/s

[[mapping]]
offset      = 0x0330  # Altimeter pressure setting (“Kollsman” window). As millibars (hectoPascals) * 16
fsuipc_type = "u16"
dataref     = "sim/cockpit2/gauges/actuators/barometer_setting_in_hg_pilot"
scale       = 541.82                   # inHg → mb*16  (1 inHg=33.8639 mb, *16)
writable    = true

[[mapping]]  # TODO: double check somehow if this is working
offset = 0x126C  # Fuel Quantity Total Weight in Pounds
fsuipc_type = "u32"
datarefs = {
    Tank0 = "sim/cockpit2/fuel/fuel_quantity[0]",
    Tank1 = "sim/cockpit2/fuel/fuel_quantity[1]",
    Tank2 = "sim/cockpit2/fuel/fuel_quantity[2]",
    Tank3 = "sim/cockpit2/fuel/fuel_quantity[3]",
    Tank4 = "sim/cockpit2/fuel/fuel_quantity[4]",
    Tank5 = "sim/cockpit2/fuel/fuel_quantity[5]",
    Tank6 = "sim/cockpit2/fuel/fuel_quantity[6]",
    Tank7 = "sim/cockpit2/fuel/fuel_quantity[7]",
    Tank8 = "sim/cockpit2/fuel/fuel_quantity[8]",
    Tank9 = "sim/cockpit2/fuel/fuel_quantity[9]",
}
expr = "$Tank0 $Tank1 + $Tank2 + $Tank3 + $Tank4 + $Tank5 + $Tank6 + $Tank7 + $Tank8 + $Tank9 + 2.20462 *"

[[mapping]]
offset      = 0x0BC8  # parking brake
fsuipc_type = "u16"
dataref    = "sim/flightmodel/controls/parkbrake"
scale       = 32767
writable    = true

[[mapping]]
offset      = 0x0BB2  # Elevator position control input
fsuipc_type = "i16"
dataref     = "sim/cockpit2/controls/total_pitch_ratio"
scale       = 16383.0
writable    = true

[[mapping]]
offset      = 0x0BB6  # Aileron control input
fsuipc_type = "i16"
