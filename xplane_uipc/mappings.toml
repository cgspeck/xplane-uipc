# # -----------------------------------------------------------------------------
# # CRASH / SAFETY FLAGS
# # 0x0840  crashed  (u16) r
# # 0x0848  off-runway crash detection  (u16)
# # 0x084A  can collide with dynamic scenery  (u16)
# # -----------------------------------------------------------------------------

[[mapping]]
offset      = 0x0840
fsuipc_type = "u16"
dataref     = "sim/flightmodel2/misc/has_crashed"

# # -----------------------------------------------------------------------------
# # ENGINE COUNT & FUEL WEIGHT
# # 0x0AEC  number of engines  (u16) r
# # 0x0AF4  fuel weight lbs/gallon*256  (u16) r
# # -----------------------------------------------------------------------------

[[mapping]]
offset      = 0x0AEC
fsuipc_type = "u16"
dataref     = "sim/aircraft/engine/acf_num_engines"

# # -----------------------------------------------------------------------------
# # BODY-AXIS ANGULAR ACCELERATIONS & RATES  (FLOAT64)
# # 0x3078  pitch accel rad/s²
# # 0x3080  roll  accel rad/s²
# # 0x3088  yaw   accel rad/s²
# # 0x30A8  pitch rate rad/s
# # 0x30B0  roll  rate rad/s
# # 0x30B8  yaw   rate rad/s
# # -----------------------------------------------------------------------------

[[mapping]]
offset      = 0x30A8
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Qrad"

[[mapping]]
offset      = 0x30B0
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Prad"

[[mapping]]
offset      = 0x30B8
fsuipc_type = "f64"
dataref     = "sim/flightmodel/position/Rrad"

# # -----------------------------------------------------------------------------
# # ELECTRICAL INDIVIDUAL SWITCHES
# # 0x3101  Alternator 1=on  (u8) rw
# # 0x3102  Battery    1=on  (u8) rw  (mirrors 0x281C)
# # 0x3103  Avionics   1=on  (u8) rw  (mirrors 0x2E80)
# # 0x3104  Fuel pump  1=on  (u8) rw
# # -----------------------------------------------------------------------------

# [[mapping]]
# offset      = 0x3101
# fsuipc_type = "u8"
# dataref     = "sim/cockpit/electrical/generator_on[0]"
# writable    = true

[[mapping]]
offset      = 0x3102
fsuipc_type = "u8"
dataref     = "sim/cockpit/electrical/battery_on"
writable    = true

# [[mapping]]
# offset      = 0x3103
# fsuipc_type = "u8"
# dataref     = "sim/cockpit/electrical/avionics_on"
# writable    = true

# [[mapping]]
# offset      = 0x3104
# fsuipc_type = "u8"
# dataref     = "sim/cockpit/engine/fuel_pump_on[0]"
# writable    = true

# # -----------------------------------------------------------------------------
# # ALTIMETER READOUT
# # 0x3324  altimeter reading feet or metres  (i32) r
# # -----------------------------------------------------------------------------

[[mapping]]
offset      = 0x3324
fsuipc_type = "i32"
dataref     = "sim/flightmodel/misc/h_ind"
scale       = 3.28084                  # metres → feet (approximate; ignores metric pref)
