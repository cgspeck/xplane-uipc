# =============================================================================
# TIME 0x0238-0x023C: each write changes one field of zulu_time_sec (Z) and
# keeps the others, and turns off "use system time" (UseSys).
# Z = 45296.5 is 12:34:56.5 Zulu.
# =============================================================================

[[case]]
offset = 0x0238
name   = "local hour"
state  = { LH = 22 }
expect = 22

[[case]]
offset = 0x0238
name   = "local hour +1 keeps minutes and seconds"
state  = { LH = 22, Z = 45296.5, UseSys = 1 }
write  = 23
expect_datarefs = { Z = 48896.5, UseSys = 0 }

[[case]]
offset = 0x0238
name   = "local hour forward past Zulu midnight"
state  = { LH = 9, Z = 84600 }
write  = 10
expect_datarefs = { Z = 1800, UseSys = 0 }

[[case]]
offset = 0x0238
name   = "local hour back past Zulu midnight"
state  = { LH = 10, Z = 1800 }
write  = 9
expect_datarefs = { Z = 84600, UseSys = 0 }

[[case]]
offset = 0x0239
name   = "local minute"
state  = { LM = 34 }
expect = 34

[[case]]
offset = 0x0239
name   = "local minute keeps hour and seconds"
state  = { LM = 34, Z = 45296.5, UseSys = 1 }
write  = 50
expect_datarefs = { Z = 46256.5, UseSys = 0 }

[[case]]
offset = 0x0239
name   = "local minute 59 to 0 stays in the same hour"
state  = { LM = 59, Z = 86390 }
write  = 0
expect_datarefs = { Z = 82850, UseSys = 0 }

[[case]]
offset = 0x0239
name   = "half-hour time zone wraps back past Zulu midnight"
state  = { LM = 30, Z = 10 }
write  = 0
expect_datarefs = { Z = 84610, UseSys = 0 }

[[case]]
offset = 0x023A
name   = "second"
state  = { S = 56 }
expect = 56

[[case]]
offset = 0x023A
name   = "second keeps hour and minute (drops the fraction)"
state  = { S = 56, Z = 45296.5, UseSys = 1 }
write  = 10
expect_datarefs = { Z = 45250, UseSys = 0 }

[[case]]
offset = 0x023B
name   = "Zulu hour"
state  = { H = 12 }
expect = 12

[[case]]
offset = 0x023B
name   = "Zulu hour keeps minutes and seconds"
state  = { H = 12, Z = 45296.5, UseSys = 1 }
write  = 1
expect_datarefs = { Z = 5696.5, UseSys = 0 }

[[case]]
offset = 0x023C
name   = "Zulu minute"
state  = { M = 34 }
expect = 34

[[case]]
offset = 0x023C
name   = "Zulu minute keeps hour and seconds"
state  = { M = 34, Z = 45296.5, UseSys = 1 }
write  = 50
expect_datarefs = { Z = 46256.5, UseSys = 0 }

