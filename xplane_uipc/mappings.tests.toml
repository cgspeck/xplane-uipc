# =============================================================================
# TIME OF DAY 0x115E: 0 = dawn, 1 = day, 2 = dusk, 3 = night. Twilight is the
# sun 0-6 degrees below the horizon; before noon it's dawn, after it's dusk.
# =============================================================================

[[case]]
offset = 0x115E
name   = "dawn"
state  = { sp = -3, lh = 6 }
expect = 0

[[case]]
offset = 0x115E
name   = "day"
state  = { sp = 30, lh = 12 }
expect = 1

[[case]]
offset = 0x115E
name   = "dusk"
state  = { sp = -3, lh = 18 }
expect = 2

[[case]]
offset = 0x115E
name   = "night"
state  = { sp = -20, lh = 23 }
expect = 3

