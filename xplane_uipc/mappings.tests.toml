# =============================================================================
# Compound mapping test cases
# =============================================================================
# Run with: cargo test -p uipc-mapping --test compound_mappings
#
# A compound mapping is an expression mapping in mappings.toml with two or more
# datarefs, or with write_exprs / write_commands. Every compound mapping needs
# cases here, or the test fails naming the offset.
#
# Every case has an offset, a name and a state. state sets the mapping's
# datarefs by their names in mappings.toml. Names left out are 0, like an
# unavailable dataref.
#
#   Read case: the value the offset serves (rounded and wrapped like the
#   plugin does for integer types; floats match to 1e-6 relative).
#
#     [[case]]
#     offset = 0x0D0C
#     name   = "beacon only"
#     state  = { Bcn = 1 }
#     expect = 2
#
#   Or, for a mapping with update_if_expr, expect_retain = true when the
#   offset should keep its previous value.
#
#   Write case: what a client write does. expect_datarefs must list every
#   write_exprs target, so a write that changes another part fails.
#   expect_commands gives each command that runs and how many times. Any
#   command left out must not run. expect_blocked = true (instead of
#   expect_datarefs) when a non-finite result should block the write.
#
#     [[case]]
#     offset = 0x0D0C
#     name   = "write beacon only"
#     write  = 2
#     expect_datarefs = { Nav = 0, Bcn = 1, Land = 0, Taxi = 0, Strb = 0 }
#     expect_commands = { "laminar/B738/toggle_switch/position_light_off" = 1, ... }
#
# Coverage. For each compound mapping there must be:
#   - a read case, and a write case if it's writable
#   - each dataref used by expr or update_if_expr set non-zero in some read case
#   - each write_exprs target written non-zero in some write case (except
#     constants such as UseSys = "0")
#   - each write_commands command run in some write case
#
# To check that one part doesn't affect another, add a case for each part
# with the other parts on (e.g. "all on except beacon").
#
# A case for a missing or non-compound offset, an unknown state name, or an
# unknown target or command is an error.

# =============================================================================
# LIGHTS 0x0D0C: 1=Nav, 2=Bcn, 4=Land, 8=Taxi, 16=Strobe, 128=Wing, 256=Logo
# B738 commands: strobe/steady/off position switch, taxi on/off, and logo and
# wing toggles that should only run when the light isn't already as requested.
# =============================================================================

[[case]]
offset = 0x0D0C
name   = "all off"
expect = 0

[[case]]
offset = 0x0D0C
name   = "nav only"
state  = { Nav = 1 }
expect = 1

[[case]]
offset = 0x0D0C
name   = "beacon only"
state  = { Bcn = 1 }
expect = 2

[[case]]
offset = 0x0D0C
name   = "landing only"
state  = { Land = 1 }
expect = 4

[[case]]
offset = 0x0D0C
name   = "taxi only"
state  = { Taxi = 1 }
expect = 8

[[case]]
offset = 0x0D0C
name   = "B738 taxi switch on, generic taxi off"
state  = { B738TaxiSwitch = 2 }
expect = 8

[[case]]
offset = 0x0D0C
name   = "strobe only"
state  = { Strb = 1 }
expect = 16

[[case]]
offset = 0x0D0C
name   = "wing only"
state  = { Wing = 1 }
expect = 128

[[case]]
offset = 0x0D0C
name   = "logo only"
state  = { Logo = 1 }
expect = 256

[[case]]
offset = 0x0D0C
name   = "all on"
state  = { Nav = 1, Bcn = 1, Land = 1, Taxi = 1, Strb = 1, Wing = 1, Logo = 1 }
expect = 415

[[case]]
offset = 0x0D0C
name   = "all on except beacon"
state  = { Nav = 1, Land = 1, Taxi = 1, Strb = 1, Wing = 1, Logo = 1 }
expect = 413

[[case]]
offset = 0x0D0C
name   = "all on except taxi (B738 switch off too)"
state  = { Nav = 1, Bcn = 1, Land = 1, Strb = 1, Wing = 1, Logo = 1 }
expect = 407

[[case]]
offset = 0x0D0C
name   = "write all on from all off"
write  = 415
expect_datarefs = { Nav = 1, Bcn = 1, Land = 1, Taxi = 1, Strb = 1 }
expect_commands = { "laminar/B738/switch/logo_light_toggle" = 1, "laminar/B738/switch/wing_light_toggle" = 1, "laminar/B738/toggle_switch/position_light_strobe" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_on" = 1 }

[[case]]
offset = 0x0D0C
name   = "write all off from all on"
state  = { Nav = 1, Bcn = 1, Land = 1, Taxi = 1, Strb = 1, Wing = 1, Logo = 1 }
write  = 0
expect_datarefs = { Nav = 0, Bcn = 0, Land = 0, Taxi = 0, Strb = 0 }
expect_commands = { "laminar/B738/switch/logo_light_toggle" = 1, "laminar/B738/switch/wing_light_toggle" = 1, "laminar/B738/toggle_switch/position_light_off" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_off" = 1 }

[[case]]
offset = 0x0D0C
name   = "write nav only (steady position lights)"
write  = 1
expect_datarefs = { Nav = 1, Bcn = 0, Land = 0, Taxi = 0, Strb = 0 }
expect_commands = { "laminar/B738/toggle_switch/position_light_steady" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_off" = 1 }

[[case]]
offset = 0x0D0C
name   = "write beacon only"
write  = 2
expect_datarefs = { Nav = 0, Bcn = 1, Land = 0, Taxi = 0, Strb = 0 }
expect_commands = { "laminar/B738/toggle_switch/position_light_off" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_off" = 1 }

[[case]]
offset = 0x0D0C
name   = "write landing only"
write  = 4
expect_datarefs = { Nav = 0, Bcn = 0, Land = 1, Taxi = 0, Strb = 0 }
expect_commands = { "laminar/B738/toggle_switch/position_light_off" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_off" = 1 }

[[case]]
offset = 0x0D0C
name   = "write taxi only"
write  = 8
expect_datarefs = { Nav = 0, Bcn = 0, Land = 0, Taxi = 1, Strb = 0 }
expect_commands = { "laminar/B738/toggle_switch/position_light_off" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_on" = 1 }

[[case]]
offset = 0x0D0C
name   = "write strobe and nav (strobe position wins)"
write  = 17
expect_datarefs = { Nav = 1, Bcn = 0, Land = 0, Taxi = 0, Strb = 1 }
expect_commands = { "laminar/B738/toggle_switch/position_light_strobe" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_off" = 1 }

[[case]]
offset = 0x0D0C
name   = "write wing on from off"
write  = 128
expect_datarefs = { Nav = 0, Bcn = 0, Land = 0, Taxi = 0, Strb = 0 }
expect_commands = { "laminar/B738/switch/wing_light_toggle" = 1, "laminar/B738/toggle_switch/position_light_off" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_off" = 1 }

[[case]]
offset = 0x0D0C
name   = "write logo on from off"
write  = 256
expect_datarefs = { Nav = 0, Bcn = 0, Land = 0, Taxi = 0, Strb = 0 }
expect_commands = { "laminar/B738/switch/logo_light_toggle" = 1, "laminar/B738/toggle_switch/position_light_off" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_off" = 1 }

[[case]]
offset = 0x0D0C
name   = "write beacon off, everything else stays on (no logo/wing toggles)"
state  = { Nav = 1, Bcn = 1, Land = 1, Taxi = 1, Strb = 1, Wing = 1, Logo = 1 }
write  = 413
expect_datarefs = { Nav = 1, Bcn = 0, Land = 1, Taxi = 1, Strb = 1 }
expect_commands = { "laminar/B738/toggle_switch/position_light_strobe" = 1, "laminar/B738/toggle_switch/taxi_light_brightness_on" = 1 }

