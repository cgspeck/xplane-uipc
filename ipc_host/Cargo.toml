[package]
name = "ipc_host"
version = "0.1.0"
edition = "2024"

[lib]
name = "ipc_host"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
ctrlc = "3.0"
tracing-subscriber = "0.3"

[dependencies]
anyhow = "1.0.102"
byteorder = "1.5.0"
chrono = "0.4"
tracing = "0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem"] }
